services:
  bot:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - deprecio-cache:/app/.cache/devices
      - deprecio-snapshots:/app/.cache/snapshots
      - ./data:/app/data:ro        # каталог смартфонов — только чтение
    healthcheck:
      test: ["CMD", "python", "-c",
             "import deprecio; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Опционально: HTTP API (uvicorn)
  api:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "uvicorn", "deprecio.api.main:app",
              "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - deprecio-cache:/app/.cache/devices
      - deprecio-snapshots:/app/.cache/snapshots
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=5); sys.exit(0 if r.status<400 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  deprecio-cache:
  deprecio-snapshots: