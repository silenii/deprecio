services:
  bot:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DEPRECIO_STATE_DIR: /app/state
      DEPRECIO_BACKUP_DIR: /app/backups
    restart: unless-stopped
    volumes:
      - deprecio-cache:/app/.cache/devices
      - deprecio-snapshots:/app/.cache/snapshots
      - deprecio-state:/app/state
      - deprecio-backups:/app/backups
      - ./data:/app/data:ro        # каталог смартфонов — только чтение
    healthcheck:
      test: ["CMD", "python", "-c",
             "import deprecio; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  alert-worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "deprecio.cli.main", "price-alert-worker"]
    env_file:
      - .env
    environment:
      DEPRECIO_STATE_DIR: /app/state
      DEPRECIO_BACKUP_DIR: /app/backups
    restart: unless-stopped
    volumes:
      - deprecio-cache:/app/.cache/devices
      - deprecio-snapshots:/app/.cache/snapshots
      - deprecio-state:/app/state
      - deprecio-backups:/app/backups
      - ./data:/app/data:ro

  used-offer-worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "deprecio.cli.main", "used-offer-worker"]
    environment:
      DEPRECIO_STATE_DIR: /app/state
      DEPRECIO_BACKUP_DIR: /app/backups
      DEPRECIO_USED_OFFER_INTERVAL_SEC: ${DEPRECIO_USED_OFFER_INTERVAL_SEC:-86400}
    restart: unless-stopped
    volumes:
      - deprecio-cache:/app/.cache/devices
      - deprecio-state:/app/state
      - deprecio-backups:/app/backups
      - ./data:/app/data:ro

  # Опционально: HTTP API (uvicorn)
  api:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "uvicorn", "deprecio.api.main:app",
              "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DEPRECIO_STATE_DIR: /app/state
      DEPRECIO_BACKUP_DIR: /app/backups
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - deprecio-cache:/app/.cache/devices
      - deprecio-snapshots:/app/.cache/snapshots
      - deprecio-state:/app/state
      - deprecio-backups:/app/backups
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=5); sys.exit(0 if r.status<400 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  deprecio-cache:
  deprecio-snapshots:
  deprecio-state:
  deprecio-backups:
