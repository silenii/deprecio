[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deprecio"
version = "0.1.0"
description = "Smartphone depreciation analytics, residual value tracker, and price decay predictor."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "silenii" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
deprecio = "deprecio.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
