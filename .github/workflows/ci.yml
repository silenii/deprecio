name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=deprecio --cov-report=term-missing --cov-fail-under=70

      - name: Check syntax (compile all modules)
        run: |
          python -m compileall -q deprecio
          echo "Syntax OK"

      - name: Run ruff linter
        run: python -m ruff check deprecio/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime Docker image
        run: docker build --target runtime -t deprecio:ci .