name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=deprecio --cov-report=term-missing --cov-report=html --cov-fail-under=70

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

      - name: Audit dependencies (warning only)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit || echo "pip-audit reported vulnerable dependencies"

      - name: Check syntax (compile all modules)
        run: |
          python -m compileall -q deprecio
          echo "Syntax OK"

      - name: Run ruff linter
        run: python -m ruff check deprecio/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker daemon
        shell: bash
        run: |
          if docker info >/dev/null 2>&1; then
            echo "Docker daemon is available"
            echo "DOCKER_AVAILABLE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Docker daemon is unavailable on this runner; Docker build will be skipped."
          echo "DOCKER_AVAILABLE=false" >> "$GITHUB_ENV"
      - name: Build runtime Docker image
        if: env.DOCKER_AVAILABLE == 'true'
        run: docker build --target runtime -t deprecio:ci .