name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Check syntax (compile all modules)
        run: |
          python -m py_compile deprecio/**/*.py
          echo "Syntax OK"

      - name: Run ruff linter
        run: ruff check deprecio/ --select E,F,W --ignore E501