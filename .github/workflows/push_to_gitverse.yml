name: Push mirror to GitVerse

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITVERSE_SSH_PRIVATE_KEY }}

      - name: Trust GitVerse host
        run: ssh-keyscan -H gitverse.ru >> "$HOME/.ssh/known_hosts"

      - name: Push mirror to GitVerse
        env:
          GITVERSE_REPOSITORY: ${{ secrets.GITVERSE_REPOSITORY }}
        run: git push --mirror "git@gitverse.ru:${GITVERSE_REPOSITORY}"